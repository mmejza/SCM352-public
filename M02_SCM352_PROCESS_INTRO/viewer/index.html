<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCM 352 · M02 — Introduction to Processes</title>
<link rel="stylesheet" href="slide-base.css">
</head>
<body>

<header class="viewer-header">
  <div>
    <div class="viewer-kicker">SCM 352 · Module 02</div>
    <h1 id="viewer-title">Introduction to Processes</h1>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <span id="viewer-module-label" style="font-size:12px;color:#6EA09D;font-family:'Barlow Condensed',sans-serif;letter-spacing:.06em;">SCM 352 · Lecture Slides</span>
    <span id="viewer-counter" class="viewer-counter">Slide 1 of 22</span>
  </div>
</header>

<div class="progress-track">
  <div id="progress-fill" class="progress-fill"></div>
</div>

<div class="viewer-layout">
  <div class="slide-column">
    <div class="slide-frame">
      <div id="slide-container" class="slide-stage">
        <div class="loading-message">Loading slides…</div>
      </div>
    </div>
    <div class="viewer-nav">
      <button id="prev-btn" class="nav-btn" type="button">← Prev</button>
      <div id="slide-dots" class="slide-dots"></div>
      <button id="next-btn" class="nav-btn" type="button">Next →</button>
    </div>
    <div class="keyboard-hint">← → Arrow keys · Home / End</div>
  </div>

  <div class="sidebar">
    <div class="side-card">
      <div class="side-card-header navy">Current Slide</div>
      <div class="side-card-body">
        <div id="side-title" class="side-title">—</div>
        <div id="side-page" class="side-page">01 / 22</div>
      </div>
    </div>
    <div class="side-card">
      <div class="side-card-header teal">Learning Objectives</div>
      <div class="side-card-body">
        <div id="side-los" class="lo-badges"></div>
      </div>
    </div>
    <div class="side-card">
      <div class="side-card-header amber">Slide Notes</div>
      <div class="side-card-body">
        <div id="side-notes" class="muted">No notes for this slide.</div>
      </div>
    </div>
  </div>
</div>

<script src="viewer.js"></script>
</body>
</html>
