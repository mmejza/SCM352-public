<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantity Discount Analyzer — SCM 352 M10</title>
<style>
:root {
  --navy:#1a3a5c; --blue:#2563a8; --blue-lt:#dbeafe; --blue-xlt:#eff6ff; --blue-bdr:#bfdbfe;
  --gold:#f59e0b; --gold-lt:#fffbeb; --gold-bdr:#fde68a; --gold-dark:#92400e;
  --green:#16a34a; --green-lt:#f0fdf4; --green-bdr:#bbf7d0;
  --red:#dc2626; --red-lt:#fef2f2; --red-bdr:#fecaca;
  --amber:#d97706; --amber-lt:#fffbeb; --amber-bdr:#fde68a;
  --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb; --gray-300:#d1d5db;
  --blue-700:#1d4ed8; --green-dark:#15803d; --amber-900:#78350f;
  --gray-400:#9ca3af; --gray-600:#4b5563; --gray-700:#374151; --gray-800:#1f2937;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--gray-50);color:var(--gray-800);min-height:100vh;}
header{background:var(--navy);color:white;padding:14px 24px;display:flex;align-items:center;gap:14px;}
.hbadge{background:var(--gold);color:var(--navy);font-weight:700;font-size:11px;padding:3px 8px;border-radius:4px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;}
header h1{font-size:17px;font-weight:600;}
.header-lo{margin-left:auto;font-size:11px;color:rgba(255,255,255,.6);}

.scen-nav{background:white;border-bottom:2px solid var(--gray-200);padding:0 20px;display:flex;gap:0;overflow-x:auto;}
.scen-btn{padding:11px 16px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--gray-600);border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s;}
.scen-btn:hover{color:var(--blue);}
.scen-btn.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;}
.scen-btn.done::after{content:' ✓';color:var(--green);}

.main{max-width:920px;margin:0 auto;padding:24px 20px;}

/* panel indicator */
.panel-bar{display:flex;gap:0;margin-bottom:20px;background:white;border:1px solid var(--gray-200);border-radius:10px;overflow:hidden;}
.panel-item{flex:1;padding:10px 8px;text-align:center;font-size:11px;color:var(--gray-400);border-right:1px solid var(--gray-200);}
.panel-item:last-child{border-right:none;}
.panel-item.p-done{background:var(--green-lt);color:var(--green);}
.panel-item.p-active{background:var(--blue-lt);color:var(--blue);font-weight:700;}
.panel-num{display:block;font-size:16px;font-weight:700;line-height:1.3;}

.card{background:white;border:1px solid var(--gray-200);border-radius:12px;overflow:hidden;margin-bottom:16px;}
.card-head{background:var(--blue-lt);padding:12px 18px;border-bottom:1px solid var(--gray-200);}
.card-head h2{font-size:14px;font-weight:700;color:var(--navy);}
.card-head p{font-size:12px;color:var(--gray-600);margin-top:3px;}
.card-body{padding:18px;}

.ctx{background:var(--gray-50);border-left:4px solid var(--blue);padding:12px 16px;border-radius:0 8px 8px 0;font-size:13px;line-height:1.65;margin-bottom:14px;}
.param-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{background:var(--blue-xlt);border:1px solid var(--blue-bdr);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--navy);}
.chip-disc{background:var(--amber-lt);border-color:var(--amber-bdr);color:var(--amber-900);}

/* TC table */
.tc-table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0;}
.tc-table th{background:var(--navy);color:white;padding:8px 12px;text-align:left;font-size:12px;}
.tc-table td{padding:8px 12px;border-bottom:1px solid var(--gray-100);}
.tc-table .input-row td{background:var(--blue-xlt);}
.tc-table .total-row td{background:var(--blue-lt);font-weight:700;color:var(--navy);}
.tc-table input[type=number]{width:120px;padding:5px 8px;border:2px solid var(--gray-300);border-radius:6px;font-size:13px;text-align:right;}
.tc-table input:focus{outline:none;border-color:var(--blue);}
.tc-table input.ok{border-color:var(--green);background:var(--green-lt);}
.tc-table input.err{border-color:var(--red);background:var(--red-lt);}

/* bar chart */
.bar-chart{display:flex;gap:12px;align-items:flex-end;height:200px;margin:16px 0;padding:0 8px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bar-label{font-size:11px;font-weight:600;color:var(--gray-700);text-align:center;}
.bar-stack{width:100%;display:flex;flex-direction:column;align-items:stretch;border-radius:4px 4px 0 0;overflow:hidden;}
.bar-seg{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:white;min-height:4px;transition:height .3s;}
.bar-seg.ordering{background:var(--blue);}
.bar-seg.holding{background:var(--amber);}
.bar-seg.purchasing{background:var(--green);}
.bar-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--gray-700);}
.leg-dot{width:10px;height:10px;border-radius:2px;}

/* decision callout */
.decision-box{border-radius:10px;padding:16px 18px;margin-top:12px;}
.decision-box.accept{background:var(--green-lt);border:2px solid var(--green-bdr);}
.decision-box.reject{background:var(--red-lt);border:2px solid var(--red-bdr);}
.decision-box h3{font-size:16px;font-weight:700;margin-bottom:6px;}
.decision-box.accept h3{color:var(--green);}
.decision-box.reject h3{color:var(--red);}

/* compare grid */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0;}
.cg-card{border-radius:8px;padding:14px;}
.cg-card.reg{background:var(--gray-50);border:1px solid var(--gray-200);}
.cg-card.disc{background:var(--amber-lt);border:1px solid var(--amber-bdr);}
.cg-card h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-600);margin-bottom:8px;}
.cg-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid rgba(0,0,0,.06);}
.cg-row:last-child{border-bottom:none;font-weight:700;}
.pos{color:var(--green);font-weight:700;}
.neg{color:var(--red);font-weight:700;}

.btn{padding:9px 22px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--blue);color:white;}
.btn-primary:hover{background:var(--blue-700);}
.btn-secondary{background:var(--gray-100);color:var(--gray-800);}
.btn-secondary:hover{background:var(--gray-200);}
.btn-green{background:var(--green);color:white;}
.btn-green:hover{background:var(--green-dark);}
.btn-group{display:flex;gap:10px;align-items:center;margin-top:14px;}

.fb{display:none;border-radius:8px;overflow:hidden;margin-top:10px;}
.fb.show{display:block;}
.fb-banner{padding:10px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
.fb-ok{background:var(--green-lt);color:var(--green);}
.fb-err{background:var(--red-lt);color:var(--red);}
.fb-warn{background:var(--amber-lt);color:var(--amber);}
.fb-body{padding:12px 14px;font-size:13px;line-height:1.6;background:white;border:1px solid var(--gray-200);border-top:none;border-radius:0 0 8px 8px;}

.tip{background:var(--gold-lt);border:1px solid var(--gold-bdr);border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.6;margin-top:12px;}
.tip-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin-bottom:4px;}

textarea.txt{width:100%;padding:10px 12px;border:2px solid var(--gray-300);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:72px;margin-top:6px;}
textarea:focus{outline:none;border-color:var(--blue);}
</style>
</head>
<body>

<header>
  <div class="hbadge">SCM 352 · M10</div>
  <h1>App 3 — Quantity Discount Analyzer</h1>
  <span class="header-lo">LO10-5</span>
</header>

<div class="scen-nav" id="scenNav"></div>
<div class="main" id="appMain"></div>

<script>
const SC = [
  {
    id:1, label:'Scenario 1', industry:'Physical Therapy Clinic', product:'resistance bands (cases)',
    ctx:'A physical therapy clinic orders resistance band cases from a medical supply distributor. Demand is steady throughout the year. The distributor is now offering a bulk discount.',
    R:2400, K:55, h:6.00, c:30, disc:0.04, Qmin:400,
    Qstar:210, cDisc:28.80, hDisc:6.00, hFixed:true,
    // TC at Qstar (regular)
    tcRegOrder:628.6, tcRegHold:630, tcRegPurch:72000, tcReg:73258.6,
    // TC at Qmin (discount)
    tcDiscOrder:330, tcDiscHold:1200, tcDiscPurch:69120, tcDisc:70650,
    accept:true, savings:2609, keyLesson:'The 4% price reduction saves $2,880 on annual purchases — far more than the extra $570 in holding cost from ordering 400 instead of 210.'
  },
  {
    id:2, label:'Scenario 2', industry:'School District Art Supplies', product:'art supply kits',
    ctx:'A school district orders student art supply kits for the district warehouse. All schools draw from this central inventory. The supplier offers a volume discount on large orders.',
    R:8000, K:40, h:1.00, c:5, disc:0.06, Qmin:1000,
    Qstar:800, cDisc:4.70, hDisc:1.00, hFixed:true,
    tcRegOrder:400, tcRegHold:400, tcRegPurch:40000, tcReg:40800,
    tcDiscOrder:320, tcDiscHold:500, tcDiscPurch:37600, tcDisc:38420,
    accept:true, savings:2380, keyLesson:'The 6% discount saves $2,400 per year on purchases. Extra holding cost at Q=1,000 vs Q*=800 is only $100. Net savings: $2,380.'
  },
  {
    id:3, label:'Scenario 3', industry:'Diagnostic Lab', product:'reagent vials',
    ctx:'A diagnostic laboratory orders reagent vials for testing procedures. The lab has a moderate annual demand. A supplier is offering a small discount for larger order quantities.',
    R:1200, K:70, h:10.00, c:50, disc:0.02, Qmin:300,
    Qstar:130, cDisc:49.00, hDisc:10.00, hFixed:true,
    tcRegOrder:646, tcRegHold:650, tcRegPurch:60000, tcReg:61296,
    tcDiscOrder:280, tcDiscHold:1500, tcDiscPurch:58800, tcDisc:60580,
    accept:true, savings:716, keyLesson:'A 2% discount on $50 vials saves $1,200/year in purchases. Extra holding cost at Q=300 vs Q*=130 is +$850 but reduced ordering saves $366. Net savings: $716. Accept, but the margin is thinner than Scenarios 1–2.'
  },
  {
    id:4, label:'Scenario 4', industry:'Community Garden', product:'seed packets (boxes)',
    ctx:'A community garden cooperative orders seed packets in bulk boxes. Annual demand is modest. A seed supplier offers a small discount — but only if the cooperative orders in very large quantities relative to its EOQ.',
    R:900, K:25, h:1.60, c:8, disc:0.03, Qmin:600,
    Qstar:168, cDisc:7.76, hDisc:1.60, hFixed:true,
    tcRegOrder:133.9, tcRegHold:134.4, tcRegPurch:7200, tcReg:7468.3,
    tcDiscOrder:37.5, tcDiscHold:480, tcDiscPurch:6984, tcDisc:7501.5,
    accept:false, savings:-33, keyLesson:'The 3% price discount saves only $216/year on purchases ($8 × 0.03 × 900). But Q_min=600 is 3.6× Q*=168 — extra holding cost is $345 more while reduced ordering saves only $96. Net penalty: $33. Reject the discount.',
    rejectNote:'In this case, the discount is not worth taking. The minimum order quantity (600) is far above Q* (168), creating significant excess holding cost. The 3% price savings on a small annual purchase total ($7,200) does not overcome the holding cost penalty.'
  }
];

let cur=0, panel=Array(4).fill(0), done=Array(4).fill(false);
let regTC=Array(4).fill(null), discTC=Array(4).fill(null);

function fmt(n,d=0){return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtD(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function close(a,b,pct=0.015){return Math.abs(a-b)/Math.max(Math.abs(b),1)<=pct;}

function calcTC(R,K,h,Q,c){
  const ord=K*(R/Q), hld=h*(Q/2), purch=c*R;
  return {ord,hld,purch,total:ord+hld+purch};
}

function renderNav(){
  document.getElementById('scenNav').innerHTML=SC.map((s,i)=>`<button class="scen-btn${i===cur?' active':''}${done[i]?' done':''}" onclick="sel(${i})">${s.label}</button>`).join('');
}

function sel(i){cur=i;renderNav();renderMain();}

function renderMain(){
  const s=SC[cur], p=panel[cur];
  const panLabels=['Regular Price TC','Discount TC','Compare & Decide'];
  const panBar=panLabels.map((l,i)=>`<div class="panel-item${i<p?' p-done':i===p?' p-active':''}">${i<p?'✓':''}<span class="panel-num">${i+1}</span>${l}</div>`).join('');

  const qStar=s.Qstar;
  const twoKRh=2*s.K*s.R/s.h;
  const cDiscFmt=fmtD(s.cDisc);

  let content='';
  if(p===0) content=renderP0(s,qStar,twoKRh);
  else if(p===1) content=renderP1(s,qStar);
  else content=renderP2(s);

  document.getElementById('appMain').innerHTML=`
    <div class="panel-bar">${panBar}</div>
    <div class="card">
      <div class="card-head"><h2>Scenario ${s.id}: ${s.industry}</h2><p>${s.product} · Panel ${p+1} of 3</p></div>
      <div class="card-body">
        <div class="ctx">${s.ctx}</div>
        <div class="param-chips">
          <span class="chip">R = ${fmt(s.R)} units/yr</span>
          <span class="chip">K = $${s.K}/order</span>
          <span class="chip">h = $${s.h.toFixed(2)}/unit/yr</span>
          <span class="chip">c<sub>reg</sub> = $${s.c}/unit</span>
          <span class="chip chip-disc">${(s.disc*100).toFixed(0)}% discount if Q ≥ ${fmt(s.Qmin)} units</span>
          <span class="chip chip-disc">c<sub>disc</sub> = $${cDiscFmt}/unit</span>
        </div>
      </div>
    </div>
    ${content}`;
}

function renderP0(s,qStar,twoKRh){
  const exact=Math.sqrt(twoKRh).toFixed(2);
  return `
    <div class="card">
      <div class="card-head"><h2>Panel 1 — Regular Price: TC at Q*</h2><p>Compute the baseline total annual cost at the EOQ using the regular unit price.</p></div>
      <div class="card-body">
        <p style="font-size:13px;color:var(--gray-700);margin-bottom:10px;">First, confirm Q*: Q* = √(2×${s.K}×${fmt(s.R)}/${s.h}) = √${fmt(twoKRh,0)} ≈ <strong>${qStar} units</strong>. Then compute TC at Q* using c = $${s.c}/unit.</p>
        <table class="tc-table">
          <thead><tr><th>Component</th><th>Formula</th><th>Your Answer ($)</th></tr></thead>
          <tbody>
            <tr class="input-row"><td><strong>Ordering cost</strong> K(R/Q)</td><td>${s.K} × (${fmt(s.R)}/${qStar})</td><td><input type="number" id="p0o" placeholder="0.00" step="0.01"></td></tr>
            <tr class="input-row"><td><strong>Holding cost</strong> h(Q/2)</td><td>${s.h.toFixed(2)} × (${qStar}/2)</td><td><input type="number" id="p0h" placeholder="0.00" step="0.01"></td></tr>
            <tr class="input-row"><td><strong>Purchasing cost</strong> cR</td><td>${s.c} × ${fmt(s.R)}</td><td><input type="number" id="p0p" placeholder="0.00" step="0.01"></td></tr>
            <tr class="total-row"><td colspan="2"><strong>Total TC at Q* (regular price)</strong></td><td><input type="number" id="p0t" placeholder="Total" step="0.01"></td></tr>
          </tbody>
        </table>
        <div class="btn-group"><button class="btn btn-primary" onclick="checkP0()">Check Panel 1</button></div>
        <div class="fb" id="fb0"></div>
      </div>
    </div>
    <div class="tip"><div class="tip-label">Remember</div>cR = $${s.c} × ${fmt(s.R)} = $${fmt(s.c*s.R,0)} — this is the annual purchase spend at regular price. It is the dominant cost component and will change when the discount applies.</div>`;
}

function checkP0(){
  const s=SC[cur];
  const o=parseFloat(document.getElementById('p0o').value);
  const h=parseFloat(document.getElementById('p0h').value);
  const p=parseFloat(document.getElementById('p0p').value);
  const t=parseFloat(document.getElementById('p0t').value);
  const fb=document.getElementById('fb0');
  fb.classList.add('show');
  if([o,h,p,t].some(isNaN)){fb.innerHTML=`<div class="fb-banner fb-err">✗ Fill in all four fields.</div>`;return;}

  const tc=calcTC(s.R,s.K,s.h,s.Qstar,s.c);
  const oOk=close(o,tc.ord,0.02), hOk=close(h,tc.hld,0.02), pOk=close(p,tc.purch,0.01), tOk=close(t,tc.total,0.015);

  if(oOk&&hOk&&pOk&&tOk){
    regTC[cur]=tc.total;
    fb.innerHTML=`<div class="fb-banner fb-ok">✓ Correct — TC at Q* = $${fmt(tc.total,2)}</div><div class="fb-body">
      Ordering: ${s.K}×(${fmt(s.R)}/${s.Qstar}) = <strong>$${fmt(tc.ord,2)}</strong> &nbsp;·&nbsp;
      Holding: ${s.h}×${s.Qstar/2} = <strong>$${fmt(tc.hld,2)}</strong> &nbsp;·&nbsp;
      Purchasing: ${s.c}×${fmt(s.R)} = <strong>$${fmt(tc.purch,0)}</strong><br>
      <strong>Total: $${fmt(tc.total,2)}</strong> — note that purchasing cost is ${((tc.purch/tc.total)*100).toFixed(0)}% of the total. Any price change will dominate.
      <div class="btn-group" style="margin-top:12px;"><button class="btn btn-primary" onclick="advance()">Next: Discount TC →</button></div>
    </div>`;
  } else {
    let hints=[];
    if(!oOk) hints.push(`Ordering = ${s.K}×(${fmt(s.R)}/${s.Qstar}) = $${fmt(tc.ord,2)}`);
    if(!hOk) hints.push(`Holding = ${s.h}×${s.Qstar/2} = $${fmt(tc.hld,2)}`);
    if(!pOk) hints.push(`Purchasing = ${s.c}×${fmt(s.R)} = $${fmt(tc.purch,0)}`);
    if(!tOk) hints.push(`Total = sum of three components`);
    fb.innerHTML=`<div class="fb-banner fb-err">✗ Check your values</div><div class="fb-body">${hints.join(' · ')}</div>`;
  }
}

function renderP1(s){
  const hNote=s.hFixed?`h stays at $${s.h.toFixed(2)}/unit/yr — it is given as a fixed dollar amount, not a percentage of unit cost.`:`h = % of unit cost — since c changes, h also changes: h<sub>disc</sub> = ${(s.h/s.c*100).toFixed(1)}% × $${s.cDisc.toFixed(2)} = $${s.hDisc.toFixed(2)}/unit/yr.`;
  return `
    <div class="card">
      <div class="card-head"><h2>Panel 2 — Discount Price: TC at Q<sub>min</sub></h2><p>Compute TC using the discounted unit price and the minimum order quantity.</p></div>
      <div class="card-body">
        <div style="background:var(--amber-lt);border:1px solid var(--amber-bdr);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px;">
          <strong>Discount terms:</strong> Order ≥ ${fmt(s.Qmin)} units → price drops from $${s.c} to $${s.cDisc.toFixed(2)}/unit (${(s.disc*100).toFixed(0)}% off).<br>${hNote}
        </div>
        <p style="font-size:13px;color:var(--gray-700);margin-bottom:10px;">Compute TC at Q = ${fmt(s.Qmin)} units using c = $${s.cDisc.toFixed(2)}/unit and h = $${s.hDisc.toFixed(2)}/unit/yr.</p>
        <table class="tc-table">
          <thead><tr><th>Component</th><th>Formula</th><th>Your Answer ($)</th></tr></thead>
          <tbody>
            <tr class="input-row"><td><strong>Ordering cost</strong> K(R/Q<sub>min</sub>)</td><td>${s.K} × (${fmt(s.R)}/${fmt(s.Qmin)})</td><td><input type="number" id="p1o" placeholder="0.00" step="0.01"></td></tr>
            <tr class="input-row"><td><strong>Holding cost</strong> h(Q<sub>min</sub>/2)</td><td>${s.hDisc.toFixed(2)} × (${fmt(s.Qmin)}/2)</td><td><input type="number" id="p1h" placeholder="0.00" step="0.01"></td></tr>
            <tr class="input-row"><td><strong>Purchasing cost</strong> c<sub>disc</sub>×R</td><td>${s.cDisc.toFixed(2)} × ${fmt(s.R)}</td><td><input type="number" id="p1p" placeholder="0.00" step="0.01"></td></tr>
            <tr class="total-row"><td colspan="2"><strong>Total TC at Q<sub>min</sub> (discount price)</strong></td><td><input type="number" id="p1t" placeholder="Total" step="0.01"></td></tr>
          </tbody>
        </table>
        <div class="btn-group"><button class="btn btn-primary" onclick="checkP1()">Check Panel 2</button></div>
        <div class="fb" id="fb1"></div>
      </div>
    </div>`;
}

function checkP1(){
  const s=SC[cur];
  const o=parseFloat(document.getElementById('p1o').value);
  const h=parseFloat(document.getElementById('p1h').value);
  const p=parseFloat(document.getElementById('p1p').value);
  const t=parseFloat(document.getElementById('p1t').value);
  const fb=document.getElementById('fb1');
  fb.classList.add('show');
  if([o,h,p,t].some(isNaN)){fb.innerHTML=`<div class="fb-banner fb-err">✗ Fill in all four fields.</div>`;return;}

  const tc=calcTC(s.R,s.K,s.hDisc,s.Qmin,s.cDisc);
  const oOk=close(o,tc.ord,0.02), hOk=close(h,tc.hld,0.02), pOk=close(p,tc.purch,0.015), tOk=close(t,tc.total,0.015);

  if(oOk&&hOk&&pOk&&tOk){
    discTC[cur]=tc.total;
    fb.innerHTML=`<div class="fb-banner fb-ok">✓ Correct — TC at Q<sub>min</sub> = $${fmt(tc.total,2)}</div><div class="fb-body">
      Ordering: <strong>$${fmt(tc.ord,2)}</strong> · Holding: <strong>$${fmt(tc.hld,2)}</strong> · Purchasing: <strong>$${fmt(tc.purch,2)}</strong> · Total: <strong>$${fmt(tc.total,2)}</strong>
      <div class="btn-group" style="margin-top:12px;"><button class="btn btn-primary" onclick="advance()">Next: Compare & Decide →</button></div>
    </div>`;
  } else {
    let hints=[];
    if(!oOk) hints.push(`Ordering = ${s.K}×(${fmt(s.R)}/${fmt(s.Qmin)}) = $${fmt(tc.ord,2)}`);
    if(!hOk) hints.push(`Holding = ${s.hDisc.toFixed(2)}×${s.Qmin/2} = $${fmt(tc.hld,2)}`);
    if(!pOk) hints.push(`Purchasing = ${s.cDisc.toFixed(2)}×${fmt(s.R)} = $${fmt(tc.purch,2)}`);
    if(!tOk) hints.push(`Total = sum above`);
    fb.innerHTML=`<div class="fb-banner fb-err">✗ Check your values</div><div class="fb-body">${hints.join(' · ')}</div>`;
  }
}

function renderP2(s){
  const tcReg=calcTC(s.R,s.K,s.h,s.Qstar,s.c);
  const tcDisc=calcTC(s.R,s.K,s.hDisc,s.Qmin,s.cDisc);
  const diff=tcReg.total-tcDisc.total;
  const accept=diff>0;
  const maxPurch=Math.max(tcReg.purch,tcDisc.purch);
  const scale=160/tcReg.total;

  function barH(val){return Math.max(val*scale,4);}

  const bar1H=[barH(tcReg.ord),barH(tcReg.hld),barH(tcReg.purch)];
  const bar2H=[barH(tcDisc.ord),barH(tcDisc.hld),barH(tcDisc.purch)];

  return `
    <div class="card">
      <div class="card-head"><h2>Panel 3 — Compare & Decide</h2><p>Side-by-side comparison of both options.</p></div>
      <div class="card-body">
        <div class="compare-grid">
          <div class="cg-card reg">
            <h4>Regular Price — Q* = ${s.Qstar} units</h4>
            <div class="cg-row"><span>Ordering cost</span><span>$${fmt(tcReg.ord,2)}</span></div>
            <div class="cg-row"><span>Holding cost</span><span>$${fmt(tcReg.hld,2)}</span></div>
            <div class="cg-row"><span>Purchasing cost (cR)</span><span>$${fmt(tcReg.purch,0)}</span></div>
            <div class="cg-row"><span>Total TC</span><span>$${fmt(tcReg.total,2)}</span></div>
          </div>
          <div class="cg-card disc">
            <h4>Discount ${(s.disc*100).toFixed(0)}% — Q<sub>min</sub> = ${fmt(s.Qmin)} units</h4>
            <div class="cg-row"><span>Ordering cost</span><span>$${fmt(tcDisc.ord,2)}</span></div>
            <div class="cg-row"><span>Holding cost</span><span>$${fmt(tcDisc.hld,2)}</span></div>
            <div class="cg-row"><span>Purchasing cost (c<sub>disc</sub>R)</span><span>$${fmt(tcDisc.purch,0)}</span></div>
            <div class="cg-row"><span>Total TC</span><span>$${fmt(tcDisc.total,2)}</span></div>
          </div>
        </div>

        <div class="bar-chart" id="barChart">
          <div class="bar-col">
            <div class="bar-stack" style="height:${bar1H[2]+bar1H[1]+bar1H[0]}px;">
              <div class="bar-seg ordering" style="height:${bar1H[0]}px;" title="Ordering: $${fmt(tcReg.ord,0)}"></div>
              <div class="bar-seg holding" style="height:${bar1H[1]}px;" title="Holding: $${fmt(tcReg.hld,0)}"></div>
              <div class="bar-seg purchasing" style="height:${bar1H[2]}px;" title="Purchasing: $${fmt(tcReg.purch,0)}"></div>
            </div>
            <span class="bar-label">Regular<br>Q*=${s.Qstar}<br>$${fmt(tcReg.total,0)}</span>
          </div>
          <div class="bar-col">
            <div class="bar-stack" style="height:${bar2H[2]+bar2H[1]+bar2H[0]}px;">
              <div class="bar-seg ordering" style="height:${bar2H[0]}px;"></div>
              <div class="bar-seg holding" style="height:${bar2H[1]}px;"></div>
              <div class="bar-seg purchasing" style="height:${bar2H[2]}px;"></div>
            </div>
            <span class="bar-label">Discount<br>Q=${fmt(s.Qmin)}<br>$${fmt(tcDisc.total,0)}</span>
          </div>
        </div>
        <div class="bar-legend">
          <div class="leg-item"><div class="leg-dot" style="background:var(--blue);"></div>Ordering cost</div>
          <div class="leg-item"><div class="leg-dot" style="background:var(--amber);"></div>Holding cost</div>
          <div class="leg-item"><div class="leg-dot" style="background:var(--green);"></div>Purchasing cost (cR)</div>
        </div>

        <div class="decision-box ${accept?'accept':'reject'}" style="margin-top:14px;">
          <h3>${accept?'✓ Accept the Discount':'✗ Reject the Discount'}</h3>
          <p style="font-size:13px;line-height:1.6;">TC at Q* = $${fmt(tcReg.total,2)} &nbsp;·&nbsp; TC at discount = $${fmt(tcDisc.total,2)} &nbsp;·&nbsp;
          ${accept?`<strong class="pos">Savings: $${fmt(Math.abs(diff),2)}/year</strong>`:`<strong class="neg">Extra cost: $${fmt(Math.abs(diff),2)}/year</strong>`}</p>
          <p style="font-size:13px;line-height:1.6;margin-top:8px;">${s.keyLesson}</p>
          ${s.rejectNote?`<div style="background:var(--red-lt);border:1px solid var(--red-bdr);border-radius:6px;padding:10px;margin-top:10px;font-size:12px;color:var(--red);">${s.rejectNote}</div>`:''}
        </div>

        <p style="font-size:13px;font-weight:600;color:var(--gray-700);margin-top:16px;margin-bottom:6px;">Explain in two sentences why cR matters here even though it didn't affect Q*:</p>
        <textarea class="txt" id="txtIn" placeholder="cR was constant when comparing quantities at the same price — it dropped out of the EOQ formula. But here, c changes between options, so cR changes and becomes the decisive factor…"></textarea>
        <div class="btn-group">
          <button class="btn btn-green" onclick="complete()">✓ Mark Scenario ${SC[cur].id} Complete</button>
          ${cur<3?`<button class="btn btn-secondary" onclick="sel(${cur+1})">Next Scenario →</button>`:''}
        </div>
      </div>
    </div>`;
}

function complete(){
  done[cur]=true;
  renderNav();
  document.querySelector('.btn-group button.btn-green').textContent='✓ Complete';
}

function advance(){panel[cur]=Math.min(panel[cur]+1,2);renderMain();}

renderNav();
renderMain();
</script>
</body>
</html>
